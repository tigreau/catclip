name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  RIPGREP_VERSION: 14.1.1
  FZF_VERSION: 0.71.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install bundled tools (rg, fzf)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-X64)    rg_triple="x86_64-apple-darwin";       rg_ext="tar.gz"; fzf_target="darwin_amd64";  fzf_ext="tar.gz"; bin_ext="" ;;
            macOS-ARM64)  rg_triple="aarch64-apple-darwin";      rg_ext="tar.gz"; fzf_target="darwin_arm64";  fzf_ext="tar.gz"; bin_ext="" ;;
            Linux-X64)    rg_triple="x86_64-unknown-linux-musl"; rg_ext="tar.gz"; fzf_target="linux_amd64";   fzf_ext="tar.gz"; bin_ext="" ;;
            Windows-X64)  rg_triple="x86_64-pc-windows-msvc";    rg_ext="zip";    fzf_target="windows_amd64"; fzf_ext="zip";    bin_ext=".exe" ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac

          rg_dir="ripgrep-${RIPGREP_VERSION}-${rg_triple}"
          rg_archive="${rg_dir}.${rg_ext}"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${rg_archive}" -o "$rg_archive"
          if [[ "$rg_ext" == "zip" ]]; then
            7z x -bd "$rg_archive" >/dev/null
            cp "${rg_dir}/rg.exe" "bin/rg.exe"
          else
            tar -xzf "$rg_archive"
            cp "${rg_dir}/rg" "bin/rg"
            chmod +x "bin/rg"
          fi

          fzf_archive="fzf-${FZF_VERSION}-${fzf_target}.${fzf_ext}"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/${fzf_archive}" -o "$fzf_archive"
          mkdir -p fzf-extract
          if [[ "$fzf_ext" == "zip" ]]; then
            7z x -bd "$fzf_archive" -ofzf-extract >/dev/null
            cp "fzf-extract/fzf.exe" "bin/fzf.exe"
          else
            tar -xzf "$fzf_archive" -C fzf-extract
            cp "fzf-extract/fzf" "bin/fzf"
            chmod +x "bin/fzf"
          fi

          "bin/rg${bin_ext}" --version
          "bin/fzf${bin_ext}" --version

      - name: Install Linux clipboard deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xclip xvfb

      - name: go test
        run: go test ./...

      - name: Bundle smoke test
        shell: bash
        run: |
          set -euo pipefail

          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi

          go build -o "catclip-bin${bin_ext}" ./cmd/catclip
          export CATCLIP_RG="$(pwd)/bin/rg${bin_ext}"
          export CATCLIP_FZF="$(pwd)/bin/fzf${bin_ext}"

          fixture=$(mktemp -d)
          for i in $(seq 1 10); do
            head -c 1000 </dev/zero | tr '\0' 'a' > "$fixture/file$i.txt"
          done

          runner=()
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            runner=(xvfb-run -a)
          fi

          (
            cd "$fixture"
            "${runner[@]+"${runner[@]}"}" "$OLDPWD/catclip-bin${bin_ext}" -y . >/dev/null
          )

          bundle_dir="${TMPDIR:-/tmp}/catclip"
          # macOS sets TMPDIR to /var/folders/...; the dir inside is still catclip.
          if [[ ! -d "$bundle_dir" ]]; then
            for candidate in "$RUNNER_TEMP/catclip" "/tmp/catclip" "$TEMP/catclip"; do
              if [[ -d "$candidate" ]]; then
                bundle_dir="$candidate"
                break
              fi
            done
          fi

          bundle=$(ls "$bundle_dir"/*.txt 2>/dev/null | head -1)
          if [[ -z "$bundle" ]]; then
            echo "ERROR: no bundle file found in $bundle_dir" >&2
            ls -la "$bundle_dir" 2>&1 || true
            exit 1
          fi
          echo "Bundle created: $bundle"

          # Filename should match {project}-{HHMMSS}.txt
          base=$(basename "$bundle")
          if ! echo "$base" | grep -qE '^[A-Za-z0-9_-]+-[0-9]{6}\.txt$'; then
            echo "ERROR: bundle basename $base does not match {project}-{HHMMSS}.txt" >&2
            exit 1
          fi

          # Permissions check (non-Windows; Windows file modes work differently).
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            mode=$(stat -c '%a' "$bundle" 2>/dev/null || stat -f '%Lp' "$bundle")
            if [[ "$mode" != "600" ]]; then
              echo "ERROR: bundle mode $mode, want 600" >&2
              exit 1
            fi
            echo "Bundle mode: $mode"
          fi

          # --no-bundle should not error and should not write a new bundle file.
          (
            cd "$fixture"
            "${runner[@]+"${runner[@]}"}" "$OLDPWD/catclip-bin${bin_ext}" -y --no-bundle . >/dev/null
          )

      - name: fileclip integration tests
        shell: bash
        env:
          FILECLIP_INTEGRATION: '1'
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a go test -v ./fileclip/
          else
            go test -v ./fileclip/
          fi
