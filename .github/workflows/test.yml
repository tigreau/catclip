name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  RIPGREP_VERSION: 14.1.1
  FZF_VERSION: 0.71.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install bundled tools (rg, fzf)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            macOS-X64)    rg_triple="x86_64-apple-darwin";       rg_ext="tar.gz"; fzf_target="darwin_amd64";  fzf_ext="tar.gz"; bin_ext="" ;;
            macOS-ARM64)  rg_triple="aarch64-apple-darwin";      rg_ext="tar.gz"; fzf_target="darwin_arm64";  fzf_ext="tar.gz"; bin_ext="" ;;
            Linux-X64)    rg_triple="x86_64-unknown-linux-musl"; rg_ext="tar.gz"; fzf_target="linux_amd64";   fzf_ext="tar.gz"; bin_ext="" ;;
            Windows-X64)  rg_triple="x86_64-pc-windows-msvc";    rg_ext="zip";    fzf_target="windows_amd64"; fzf_ext="zip";    bin_ext=".exe" ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac

          rg_dir="ripgrep-${RIPGREP_VERSION}-${rg_triple}"
          rg_archive="${rg_dir}.${rg_ext}"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${rg_archive}" -o "$rg_archive"
          if [[ "$rg_ext" == "zip" ]]; then
            7z x -bd "$rg_archive" >/dev/null
            cp "${rg_dir}/rg.exe" "bin/rg.exe"
          else
            tar -xzf "$rg_archive"
            cp "${rg_dir}/rg" "bin/rg"
            chmod +x "bin/rg"
          fi

          fzf_archive="fzf-${FZF_VERSION}-${fzf_target}.${fzf_ext}"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/${fzf_archive}" -o "$fzf_archive"
          mkdir -p fzf-extract
          if [[ "$fzf_ext" == "zip" ]]; then
            7z x -bd "$fzf_archive" -ofzf-extract >/dev/null
            cp "fzf-extract/fzf.exe" "bin/fzf.exe"
          else
            tar -xzf "$fzf_archive" -C fzf-extract
            cp "fzf-extract/fzf" "bin/fzf"
            chmod +x "bin/fzf"
          fi

          "bin/rg${bin_ext}" --version
          "bin/fzf${bin_ext}" --version

      - name: Install Linux clipboard deps
        if: runner.os == 'Linux'
        run: |
          # v0.6.0 dropped X11 clipboard support entirely.
          # The bundle smoke test injects a stub wl-copy + Wayland env vars so
          # we never need a real Wayland compositor on the CI runner.
          # No clipboard packages required at install time.
          echo "Linux clipboard deps: none required (Wayland-only at runtime)."

      - name: go test
        run: go test ./...

      - name: Linux session gate smoke tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          # Build the binary the same way the bundle smoke test does so we
          # exercise the real Main() entry, not just unit-level helpers.
          go build -o catclip-gate-bin ./cmd/catclip
          export CATCLIP_RG="$(pwd)/bin/rg"
          export CATCLIP_FZF="$(pwd)/bin/fzf"

          fixture=$(mktemp -d)
          printf 'hello\n' > "$fixture/file.txt"

          run() {
            # run <label> <expected_exit> <env_assignments...> -- <args...>
            local label="$1"; shift
            local want_exit="$1"; shift
            local args=()
            local env_pairs=()
            local saw_dash_dash=false
            for arg in "$@"; do
              if [[ "$arg" == "--" && "$saw_dash_dash" == false ]]; then
                saw_dash_dash=true
                continue
              fi
              if [[ "$saw_dash_dash" == false ]]; then
                env_pairs+=("$arg")
              else
                args+=("$arg")
              fi
            done
            local stderr_file; stderr_file=$(mktemp)
            local stdout_file; stdout_file=$(mktemp)
            set +e
            (
              cd "$fixture"
              # Each invocation gets a clean Linux-session env baseline; the
              # caller overrides via env_pairs to inject X11/Wayland/etc.
              unset DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE
              for pair in "${env_pairs[@]}"; do
                export "$pair"
              done
              "$OLDPWD/catclip-gate-bin" "${args[@]}" >"$stdout_file" 2>"$stderr_file"
            )
            local got_exit=$?
            set -e
            if [[ "$got_exit" -ne "$want_exit" ]]; then
              echo "FAIL [$label]: exit=$got_exit, want=$want_exit" >&2
              echo "--- stdout ---" >&2; cat "$stdout_file" >&2
              echo "--- stderr ---" >&2; cat "$stderr_file" >&2
              exit 1
            fi
            echo "OK [$label]: exit=$got_exit"
            export GATE_STDOUT_FILE="$stdout_file"
            export GATE_STDERR_FILE="$stderr_file"
          }

          assert_stderr_contains() {
            local label="$1"; shift
            local needle="$1"; shift
            if ! grep -F -q "$needle" "$GATE_STDERR_FILE"; then
              echo "FAIL [$label]: stderr missing $needle" >&2
              echo "--- stderr ---" >&2; cat "$GATE_STDERR_FILE" >&2
              exit 1
            fi
          }

          # ──────────────────────────────────────────────────────────────────
          # 1. Detected X11 desktop session: every entry point fails at startup.
          # ──────────────────────────────────────────────────────────────────
          for args in "--help" "--version" "--print ." "."; do
            # shellcheck disable=SC2086
            run "X11 + $args" 2 \
              "DISPLAY=:0" "XDG_SESSION_TYPE=x11" \
              -- $args
            assert_stderr_contains "X11 + $args (msg)" \
              "X11 clipboard delivery is not reliable"
            assert_stderr_contains "X11 + $args (remedy)" \
              "Log into a Wayland session"
          done

          # XDG_SESSION_TYPE unset + DISPLAY set is also detected-X11. Stale
          # SSH-from-desktop env inherits this shape; the gate must fire.
          run "X11 via bare DISPLAY" 2 "DISPLAY=:0" -- --help
          assert_stderr_contains "X11 via bare DISPLAY" \
            "X11 clipboard delivery is not reliable"

          # ──────────────────────────────────────────────────────────────────
          # 2. Unknown/displayless Linux (the CI/SSH/Docker shape):
          #    stdout-bound invocations run normally; clipboard sinks fail
          #    with the Wayland-required message, not the gate message.
          # ──────────────────────────────────────────────────────────────────
          run "displayless --print ." 0 -- --print .
          if ! grep -F -q '<file path="file.txt">' "$GATE_STDOUT_FILE"; then
            echo "FAIL [displayless --print .]: stdout missing emitted file" >&2
            echo "--- stdout ---" >&2; cat "$GATE_STDOUT_FILE" >&2
            echo "--- stderr ---" >&2; cat "$GATE_STDERR_FILE" >&2
            exit 1
          fi
          if grep -F -q "X11 clipboard delivery" "$GATE_STDERR_FILE" || \
             grep -F -q "Clipboard output requires Wayland" "$GATE_STDERR_FILE"; then
            echo "FAIL [displayless --print .]: stderr shows a session/clipboard gate" >&2
            echo "--- stderr ---" >&2; cat "$GATE_STDERR_FILE" >&2
            exit 1
          fi

          # Default clipboard sink without any display vars: should hit the
          # 'Clipboard output requires Wayland' branch (exit 1), NOT the X11
          # gate (exit 2).
          set +e
          (
            cd "$fixture"
            unset DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE
            "$OLDPWD/catclip-gate-bin" -y . >/dev/null 2>/tmp/displayless_clip_stderr
          )
          got_exit=$?
          set -e
          if [[ "$got_exit" -ne 1 ]]; then
            echo "FAIL [displayless default sink]: exit=$got_exit, want=1" >&2
            cat /tmp/displayless_clip_stderr >&2
            exit 1
          fi
          if ! grep -F -q "Clipboard output requires Wayland" /tmp/displayless_clip_stderr; then
            echo "FAIL [displayless default sink]: stderr missing 'Clipboard output requires Wayland'" >&2
            cat /tmp/displayless_clip_stderr >&2
            exit 1
          fi
          echo "OK [displayless default sink]: Wayland-required message surfaced"

          # ──────────────────────────────────────────────────────────────────
          # 3. Wayland session without wl-copy on PATH: gate does not fire,
          #    but the clipboard path returns the missing-tool message.
          # ──────────────────────────────────────────────────────────────────
          empty_path_dir=$(mktemp -d)
          set +e
          (
            cd "$fixture"
            # Strip wl-copy deterministically. The binary gets rg/fzf from
            # absolute CATCLIP_* paths, so this child PATH can be empty except
            # for the scratch directory.
            PATH="$empty_path_dir" \
              XDG_SESSION_TYPE=wayland \
              WAYLAND_DISPLAY=wayland-0 \
              "$OLDPWD/catclip-gate-bin" -y . >/dev/null 2>/tmp/wayland_no_wlcopy_stderr
          )
          got_exit=$?
          set -e
          if [[ "$got_exit" -eq 0 ]]; then
            echo "FAIL [Wayland without wl-copy]: expected non-zero exit, got 0" >&2
            cat /tmp/wayland_no_wlcopy_stderr >&2
            exit 1
          fi
          if ! grep -F -q "wl-copy" /tmp/wayland_no_wlcopy_stderr; then
            echo "FAIL [Wayland without wl-copy]: stderr missing 'wl-copy'" >&2
            cat /tmp/wayland_no_wlcopy_stderr >&2
            exit 1
          fi
          echo "OK [Wayland without wl-copy]: missing-tool message surfaced"

          echo
          echo "All Linux session gate smoke tests passed."

      - name: Bundle smoke test
        shell: bash
        run: |
          set -euo pipefail

          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi

          go build -o "catclip-bin${bin_ext}" ./cmd/catclip
          export CATCLIP_RG="$(pwd)/bin/rg${bin_ext}"
          export CATCLIP_FZF="$(pwd)/bin/fzf${bin_ext}"

          fixture=$(mktemp -d)
          for i in $(seq 1 10); do
            head -c 1000 </dev/zero | tr '\0' 'a' > "$fixture/file$i.txt"
          done

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            stub_dir=$(mktemp -d)
            cat >"$stub_dir/wl-copy" <<'EOF'
          #!/usr/bin/env bash
          cat >/dev/null
          EOF
            chmod +x "$stub_dir/wl-copy"
            export PATH="$stub_dir:$PATH"
            export XDG_SESSION_TYPE=wayland
            export WAYLAND_DISPLAY=wayland-0
          fi

          (
            cd "$fixture"
            "$OLDPWD/catclip-bin${bin_ext}" -y . >/dev/null
          )

          bundle_dir="$HOME/Documents/catclip"
          shopt -s nullglob
          bundle_files=("$bundle_dir"/*.txt)
          bundle="${bundle_files[0]:-}"
          shopt -u nullglob
          if [[ -z "$bundle" ]]; then
            echo "ERROR: no bundle file found in $bundle_dir" >&2
            ls -la "$bundle_dir" 2>&1 || true
            exit 1
          fi
          echo "Bundle created: $bundle"

          # Filename should match {project}-{HHMMSS}.txt
          base=$(basename "$bundle")
          if ! echo "$base" | grep -qE '^[A-Za-z0-9_-]+-[0-9]{6}\.txt$'; then
            echo "ERROR: bundle basename $base does not match {project}-{HHMMSS}.txt" >&2
            exit 1
          fi

          # Permissions check (non-Windows; Windows file modes work differently).
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            mode=$(stat -c '%a' "$bundle" 2>/dev/null || stat -f '%Lp' "$bundle")
            if [[ "$mode" != "600" ]]; then
              echo "ERROR: bundle mode $mode, want 600" >&2
              exit 1
            fi
            echo "Bundle mode: $mode"
          fi

          # Bundle content: the fixture files are 1000 bytes of 'a' each.
          # The bundle is the concatenated emit, so it must contain that run.
          if ! grep -q 'aaaaaaaaaa' "$bundle"; then
            echo "ERROR: bundle file does not contain expected fixture content" >&2
            head -c 200 "$bundle" >&2 || true
            exit 1
          fi
          bytes=$(wc -c < "$bundle")
          if [[ "$bytes" -lt 9000 ]]; then
            echo "ERROR: bundle is $bytes bytes; expected ~10000 from 10 fixture files" >&2
            exit 1
          fi
          echo "Bundle content verified ($bytes bytes)"

          # --no-bundle should not error and should not write a new bundle file.
          shopt -s nullglob
          before_no_bundle=("$bundle_dir"/*.txt)
          before_no_bundle_count=${#before_no_bundle[@]}
          shopt -u nullglob
          (
            cd "$fixture"
            "$OLDPWD/catclip-bin${bin_ext}" -y --no-bundle . >/dev/null
          )
          shopt -s nullglob
          after_no_bundle=("$bundle_dir"/*.txt)
          after_no_bundle_count=${#after_no_bundle[@]}
          shopt -u nullglob
          if [[ "$after_no_bundle_count" -ne "$before_no_bundle_count" ]]; then
            echo "ERROR: --no-bundle wrote a new bundle file ($before_no_bundle_count -> $after_no_bundle_count)" >&2
            ls -la "$bundle_dir" >&2 || true
            exit 1
          fi
          echo "--no-bundle left bundle count unchanged"

      - name: Help text shell-paste form (DisplayPath regression guard)
        shell: bash
        run: |
          set -euo pipefail
          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi
          export CATCLIP_RG="$(pwd)/bin/rg${bin_ext}"
          export CATCLIP_FZF="$(pwd)/bin/fzf${bin_ext}"

          help_short=$("./catclip-bin${bin_ext}" --help)
          help_full=$("./catclip-bin${bin_ext}" --help-all)

          check() {
            local label="$1"; shift
            local text="$1"; shift
            local mode="$1"; shift
            local needle="$1"; shift
            if [[ "$mode" == "want" ]]; then
              if ! printf '%s' "$text" | grep -F -q -- "$needle"; then
                echo "FAIL [$label]: missing $needle" >&2
                printf '%s\n' "$text" >&2
                exit 1
              fi
            else
              if printf '%s' "$text" | grep -F -q -- "$needle"; then
                echo "FAIL [$label]: stale '$needle' present (shortPath regression)" >&2
                printf '%s\n' "$text" >&2
                exit 1
              fi
            fi
          }

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # The v0.6.3 DisplayPath consolidation fixed the shortPath
            # Windows bug: PowerShell does not expand "~" for external
            # programs, so a printed "~\.config\catclip\.hiss" failed to
            # paste-run. The fix uses "$HOME\.config\catclip\.hiss"
            # which PowerShell expands as an automatic variable.
            check "help_short" "$help_short" want '$HOME\.config\catclip\.hiss'
            check "help_full"  "$help_full"  want '$HOME\.config\catclip\.hiss'
            check "help_short" "$help_short" never '~\.config\catclip'
            check "help_full"  "$help_full"  never '~\.config\catclip'
          else
            # POSIX shells expand "~" before passing args to external tools.
            # Guard against "$HOME" leaking into the POSIX branch.
            check "help_short" "$help_short" want '~/.config/catclip/.hiss'
            check "help_full"  "$help_full"  want '~/.config/catclip/.hiss'
            check "help_short" "$help_short" never '$HOME/.config/catclip'
            check "help_full"  "$help_full"  never '$HOME/.config/catclip'
          fi
          echo "DisplayPath help-text smoke passed on ${{ runner.os }}"

      - name: --contains smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi
          export CATCLIP_RG="$(pwd)/bin/rg${bin_ext}"
          export CATCLIP_FZF="$(pwd)/bin/fzf${bin_ext}"

          fixture=$(mktemp -d)
          printf 'function hello() {\n  return 42\n}\n' > "$fixture/yes.txt"
          printf 'plain content\nno match here\n' > "$fixture/no.txt"

          out=$(
            cd "$fixture"
            "$OLDPWD/catclip-bin${bin_ext}" . --contains 'function' --paths --headless
          )

          if ! echo "$out" | grep -q 'yes.txt'; then
            echo "ERROR: --contains 'function' did not match yes.txt" >&2
            echo "stdout was:" >&2
            echo "$out" >&2
            exit 1
          fi
          if echo "$out" | grep -q 'no.txt'; then
            echo "ERROR: --contains 'function' wrongly matched no.txt" >&2
            echo "stdout was:" >&2
            echo "$out" >&2
            exit 1
          fi

          # Also exercise a PCRE2-only feature (lookahead) to prove the
          # rg+PCRE2 wire-up is real, not just a Go-RE2 fallback.
          out=$(
            cd "$fixture"
            "$OLDPWD/catclip-bin${bin_ext}" . --contains 'function(?= hello)' --paths --headless
          )
          if ! echo "$out" | grep -q 'yes.txt'; then
            echo "ERROR: PCRE2 lookahead failed to match yes.txt" >&2
            echo "stdout was:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "--contains + PCRE2 lookahead verified"

      - name: Text-path smoke test (small payload bypasses bundling)
        shell: bash
        run: |
          set -euo pipefail
          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi
          export CATCLIP_RG="$(pwd)/bin/rg${bin_ext}"
          export CATCLIP_FZF="$(pwd)/bin/fzf${bin_ext}"

          bundle_dir="$HOME/Documents/catclip"
          # Wipe prior bundle state so this run's absence is meaningful.
          rm -rf "$bundle_dir"

          fixture=$(mktemp -d)
          echo "tiny payload" > "$fixture/small.txt"

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            stub_dir=$(mktemp -d)
            cat >"$stub_dir/wl-copy" <<'EOF'
          #!/usr/bin/env bash
          cat >/dev/null
          EOF
            chmod +x "$stub_dir/wl-copy"
            export PATH="$stub_dir:$PATH"
            export XDG_SESSION_TYPE=wayland
            export WAYLAND_DISPLAY=wayland-0
          fi

          (
            cd "$fixture"
            "$OLDPWD/catclip-bin${bin_ext}" -y small.txt >/dev/null
          )

          # A <4KB payload must take the text clipboard path; no bundle file.
          if [[ -d "$bundle_dir" ]] && [[ -n "$(ls -A "$bundle_dir" 2>/dev/null || true)" ]]; then
            echo "ERROR: small payload created a bundle file (text path should have run)" >&2
            ls -la "$bundle_dir" >&2 || true
            exit 1
          fi
          echo "Small payload bypassed bundling"

      - name: catclip --internal-tree-preview --input-dir / --input-stem smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin_ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_ext=".exe"
          fi

          payload_dir=$(mktemp -d)
          # Minimal valid tree payload; matches the schema in
          # internal/tree/payload.go (meta + entry + summary records).
          {
            printf '{"type":"meta","version":1,"mode":"tree","root":"."}\n'
            printf '{"type":"entry","path":"hello.txt","kind":"file","size":6}\n'
            printf '{"type":"summary","count":1,"bytes":6,"human_size":"6B","tokens":1,"file_word":"file"}\n'
          } > "$payload_dir/picked.json"

          out=$("./catclip-bin${bin_ext}" --quiet --internal-tree-preview --input-dir "$payload_dir" --input-stem picked)
          if ! echo "$out" | grep -q 'hello.txt'; then
            echo "ERROR: catclip --internal-tree-preview --input-dir/--input-stem did not render fixture entry" >&2
            echo "stdout was:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "catclip --internal-tree-preview --input-dir/--input-stem verified"

      - name: fileclip integration tests
        shell: bash
        env:
          FILECLIP_INTEGRATION: '1'
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            stub_dir=$(mktemp -d)
            cat >"$stub_dir/wl-copy" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          stub_dir="$(dirname "$0")"
          mime="text/plain"
          if [[ "${1:-}" == "--foreground" ]]; then
            shift
          fi
          if [[ "${1:-}" == "--type" ]]; then
            mime="${2:-text/plain}"
            shift 2
          fi
          payload_file="$stub_dir/payload"
          mime_file="$stub_dir/mime"
          /bin/cat >"$payload_file"
          printf '%s\n' "$mime" >"$mime_file"
          EOF
            cat >"$stub_dir/wl-paste" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          stub_dir="$(dirname "$0")"
          payload_file="$stub_dir/payload"
          mime_file="$stub_dir/mime"
          case "${1:-}" in
            --list-types)
              if [[ -f "$mime_file" ]]; then
                /bin/cat "$mime_file"
              fi
              ;;
            --type)
              wanted="${2:-}"
              if [[ ! -f "$payload_file" || ! -f "$mime_file" ]]; then
                exit 1
              fi
              current="$(/bin/cat "$mime_file")"
              if [[ "$wanted" != "$current" ]]; then
                exit 1
              fi
              /bin/cat "$payload_file"
              ;;
            *)
              exit 1
              ;;
          esac
          EOF
            chmod +x "$stub_dir/wl-copy" "$stub_dir/wl-paste"
            export PATH="$stub_dir:$PATH"
            export XDG_SESSION_TYPE=wayland
            export WAYLAND_DISPLAY=wayland-0
            export XDG_CURRENT_DESKTOP=GNOME
            export CATCLIP_GNOME_VERSION=46
            go test -v ./fileclip/
          else
            go test -v ./fileclip/
          fi
